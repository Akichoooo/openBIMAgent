# 市政管网工程约束(市政排水为主,管线综合为辅)
# 数据源:GB 50014-2021《室外排水设计标准》/ GB 50013-2018《室外给水设计标准》/ GB 50289-2016《城市工程管线综合规划规范》
# 核实日期:2026-07-22
# 字段说明:
#   rule_id        - 规则 ID(分类前缀:DRAIN 几何水力 / WELL 检查井 / SEPARATE 雨污分流 / ELEV 竖向覆土 / AVOID 避让 / CLEAR 净距)
#   category       - 规则类别(geometry_pipe / hydraulics / routing_vertical / routing_clash / system_separation / inspection_well / horizontal_clearance)
#   parameter      - 参数名
#   value/range    - 数值或区间
#   unit           - 单位
#   source_clause  - 准确条文号(含规范编号)
#   verified_by    - 旧知识条目的核实方式；可执行净距规则改用 verification 结构化证据
#   verification   - 标准身份、状态、内容副本、SHA-256、页表定位、核验日期与适用性完整性
#   confidence     - high / medium / low；high 本身不等于 production，仍须通过 verification 门禁
# 消费方:domain_gate(确定性规则校验)。数值错一条,生成的管网就错一片,故低置信条目需人工复核后再上线。

constraints:
  # ============ 一、管径与坡度(GB 50014-2021 §5.2)============
  - rule_id: MU-DRAIN-001
    category: geometry_pipe
    parameter: min_diameter_sewage
    value: 300
    unit: mm
    source_clause: GB 50014-2021 §5.2.10 表 5.2.10
    verified_by: original_text
    confidence: high
    note: 污水管/合流管最小管径 300mm;原 yaml source_clause "4.2" 系设计流量章,已纠正。

  - rule_id: MU-DRAIN-002
    category: geometry_pipe
    parameter: min_diameter_rainwater
    value: 300
    unit: mm
    source_clause: GB 50014-2021 §5.2.10 表 5.2.10
    verified_by: original_text
    confidence: high
    note: 雨水管最小管径 300mm(雨水口连接管除外,见 MU-DRAIN-003)。

  - rule_id: MU-DRAIN-003
    category: geometry_pipe
    parameter: min_diameter_rainwater_connector
    value: 200
    unit: mm
    source_clause: GB 50014-2021 §5.2.10 表 5.2.10
    verified_by: original_text
    confidence: high
    note: 雨水口连接管最小管径 200mm(任务 B 第 6 项核实:200mm 准确)。

  - rule_id: MU-DRAIN-004
    category: geometry_pipe
    parameter: min_slope_sewage_d300_concrete
    value: 0.003
    unit: ratio
    source_clause: GB 50014-2021 §5.2.10 表 5.2.10
    verified_by: original_text
    confidence: high
    note: DN300 污水管(混凝土/一般材质)最小设计坡度;原 yaml MU-DRAIN-002 数值正确,补全材质区分。

  # 注:塑料管(DN300)最小坡度 0.002、雨水口连接管(DN200)最小坡度 0.01 已纳入 MU-DRAIN-012 管径序列表,不单列。

  - rule_id: MU-DRAIN-007
    category: hydraulics
    parameter: min_velocity_sewage
    value: 0.6
    unit: m/s
    source_clause: GB 50014-2021 §5.2.7 第 1 款
    verified_by: original_text
    confidence: high
    note: 污水管道在设计充满度下最小设计流速 0.6m/s(防淤积)。

  - rule_id: MU-DRAIN-008
    category: hydraulics
    parameter: min_velocity_rainstorm_combined
    value: 0.75
    unit: m/s
    source_clause: GB 50014-2021 §5.2.7 第 2 款
    verified_by: original_text
    confidence: high
    note: 雨水管道和合流管道在满流时最小设计流速 0.75m/s。

  - rule_id: MU-DRAIN-009
    category: geometry_pipe
    parameter: max_diameter_reduction_steps
    value: 2
    unit: levels
    source_clause: GB 50014-2021 §5.2.11
    verified_by: original_text
    confidence: high
    note: "原文逐字:管道在坡度变陡处,其管径可根据水力计算确定,由大变小,但不得超过 2 级,且不得小于相应条件下的最小管径。"

  - rule_id: MU-DRAIN-010
    category: geometry_pipe
    parameter: min_flow_turn_angle
    value: 90
    unit: degree
    source_clause: GB 50014-2021 §5.3.2
    verified_by: original_text
    confidence: high
    note: 管道转弯和交接处水流转角不应小于 90°;当管径≤300mm 且跌水水头>0.3m 时可不受此限。

  # 注:雨水口连接管长度限值(§5.7.3,25m)仅在 §5.3.9 条文说明中被引用,未见原文,置信度低,暂不入库;需人工核对 §5.7.3 后再决定是否新增。

  # 常用管径序列及对应最小设计坡度(任务 B 第 4 项)
  - rule_id: MU-DRAIN-012
    category: geometry_pipe
    parameter: diameter_series_with_min_slope
    value:
      - {diameter_mm: 200, scope: "雨水口连接管", min_slope: 0.01}
      - {diameter_mm: 300, scope: "污水/雨水/合流干支管(混凝土)", min_slope: 0.003}
      - {diameter_mm: 300, scope: "污水/雨水/合流干支管(塑料)", min_slope: 0.002}
      - {diameter_mm: 400, scope: "污水/雨水干管", min_slope: 0.0015}
      - {diameter_mm: 500, scope: "污水/雨水干管", min_slope: null}
      - {diameter_mm: 600, scope: "污水/雨水干管", min_slope: null}
      - {diameter_mm: 800, scope: "污水/雨水主干管", min_slope: null}
      - {diameter_mm: 1000, scope: "污水/雨水主干管", min_slope: null}
    unit: mm / ratio
    source_clause: GB 50014-2021 §5.2.10 表 5.2.10(仅 DN200/300 为规范明文最小坡度;DN400 及以上由水力计算确定)
    verified_by: mixed
    confidence: medium
    note: |
      DN200/300 最小坡度为规范明文(HIGH);DN400=0.0015 来自工程实务二手引用(MEDIUM);
      DN500/600/800/1000 的最小坡度规范未列固定表,应按曼宁公式水力计算确定(min_slope=null 表示由水力计算给定,不设固定下限)。
      建议人工对照 GB 50014-2021 §5.2.10 原表及条文说明复核。

  # ============ 二、检查井(GB 50014-2021 §5.4)============
  - rule_id: MU-WELL-001
    category: inspection_well
    parameter: max_spacing_by_diameter
    value:
      - {diameter_range_mm: "300-600", max_spacing_m: 75}
      - {diameter_range_mm: "700-1000", max_spacing_m: 100}
      - {diameter_range_mm: "1100-1500", max_spacing_m: 150}
      - {diameter_range_mm: "1600-2000", max_spacing_m: 200}
    unit: m
    source_clause: GB 50014-2021 §5.4.4 表 5.4.4
    verified_by: original_text
    confidence: high
    note: 检查井最大间距按管径分 4 档;表图为图片,数值经多源(含 toutiao 明确引用"表 5.4.4")交叉印证。养护车辆难以进入的道路(如透水铺装步行街)按人工养护确定,最大间距不宜大于 40m。

  # ============ 三、雨污分流制(GB 50014-2021 §3.1 / §5.1 / §5.4)============
  - rule_id: MU-SEPARATE-001
    category: system_separation
    parameter: rain_sewage_separation_prohibition
    value: "sewage_into_rainwater_forbidden"
    unit: boolean
    source_clause: GB 50014-2021 §3.1.2 第 3 款
    verified_by: original_text
    confidence: high
    note: "原文:分流制排水系统禁止污水接入雨水管网。该条非强条清单内条目,但用'禁止'用语,具强制约束力。"

  - rule_id: MU-SEPARATE-002
    category: system_separation
    parameter: no_connection_between_rain_and_combined
    value: "rain_combined_no_direct_connection"
    unit: boolean
    source_clause: GB 50014-2021 §5.1.14 第 1 款
    verified_by: original_text
    confidence: high
    note: "原文:雨水管渠系统和合流管道系统之间不得设置连通管(防止雨污混接)。"

  - rule_id: MU-SEPARATE-003
    category: system_separation
    parameter: manhole_cover_labeling
    value: "label_rain_and_sewage"
    unit: boolean
    source_clause: GB 50014-2021 §5.4.2
    verified_by: original_text
    confidence: high
    note: 建筑物和小区内均应采用分流制;井盖分别标识"雨"和"污",合流污水管标识"污"。

  # ============ 四、竖向与覆土(GB 50014-2021 §5.3)============
  - rule_id: MU-ELEV-001
    category: routing_vertical
    parameter: min_cover_depth_driveway
    range: ">= 0.7"
    unit: m
    source_clause: GB 50014-2021 §5.3.7
    verified_by: original_text
    confidence: high
    note: "关键纠错:原 yaml 把 0.7m 标为 GB 50289-2016,实际出自 GB 50014-2021 §5.3.7(车行道下宜为 0.7m)。GB 50289-2016 §4.1.8 为强条但只规定'应符合表 4.1.3',排水管具体 0.7m 数值在 GB 50014。"

  - rule_id: MU-ELEV-002
    category: routing_vertical
    parameter: min_cover_depth_sidewalk
    range: ">= 0.6"
    unit: m
    source_clause: GB 50014-2021 §5.3.7
    verified_by: original_text
    confidence: high
    note: 人行道下管顶最小覆土深度宜为 0.6m(与车行道 0.7m 同条)。

  - rule_id: MU-ELEV-003
    category: routing_vertical
    parameter: ice_line_burial_method
    value: "drain_pipe_buried_below_frost_line_preferred"
    unit: rule
    source_clause: GB 50014-2021 §5.3.8
    verified_by: original_text
    confidence: high
    note: "原文:冰冻地区的排水管道宜埋设在冰冻线以下;有浅埋经验或采取措施时可埋设在冰冻线以上,但应保证安全运行。GB 50013-2018 给水管道埋深具体条款号未查到,建议人工核对。"

  # ============ 五、管线避让原则(GB 50289-2016 §3.0.4)============
  - rule_id: MU-AVOID-001
    category: routing_clash
    parameter: yield_priority_ordered_list
    value:
      - "pressure_yields_to_gravity"
      - "flexible_yields_to_rigid"
      - "branch_yields_to_trunk"
      - "small_diameter_yields_to_large"
      - "temporary_yields_to_permanent"
    unit: rule
    source_clause: GB 50289-2016 §3.0.4
    verified_by: original_text
    confidence: high
    note: "5 条避让原则按优先级排序;用词为'宜'(推荐)。原 yaml MU-AVOID-001 只列第 1 条,现补全 5 条。条款号(§3.0.4)置信度 medium,内容置信度 high。"

  # ============ 六、管线最小水平净距(GB 50289-2016 第 4.1.9 条 / 表 4.1.9)============
  # 内容核验:2026-08-01 直接核对政府域名 PDF 第 13-15 页横向原表,并用独立 PDF 版面交叉复核。
  # 标准状态与表格数值分别取证；本表 4.1.9 为一般条文，不属于本规范黑体强制性条文。
  # 4.1.9 允许在受限条件下采取安全措施后减小净距，但当前系统没有例外审批协议，故不允许调用方覆写减距。
  - rule_id: MU-CLEAR-001
    category: horizontal_clearance
    parameter: clearance_building_to_sewage_rain
    value: 2.5
    unit: m
    source_clause: GB 50289-2016 §4.1.9 表 4.1.9
    verified_by: original_table_crosscheck
    confidence: high
    verification: &gb50289_table419_verification
      status: verified
      source_tier: official_copy
      standard_id: GB 50289-2016
      standard_title: 城市工程管线综合规划规范
      standard_status: current
      status_checked_at: "2026-08-01"
      status_source_url: https://www.gongbiaoku.com/book/tb617154atk
      clause: 4.1.9
      table: 4.1.9
      content_checked_at: "2026-08-01"
      content_source_url: https://www.yichang.gov.cn/uploadfile/2017/0522/20170522065729162.pdf
      content_sha256: ddb68a18b81146fba4443962ce94f641abeb3d9914e1aeb0c69cc21bd5e3a426
      evidence_locator: PDF pages 13-15; row 污水、雨水管线; column 建(构)筑物
      crosscheck_source: independent_pdf_copy
      applicability_complete: true
    note: 建(构)筑物 ↔ 污水、雨水管线 = 2.5m；按水平净距定义测量。

  - rule_id: MU-CLEAR-002
    category: horizontal_clearance
    parameter: clearance_building_to_water_large
    value: 3.0
    unit: m
    source_clause: GB 50289-2016 §4.1.9 表 4.1.9
    verified_by: legacy_not_compiled
    confidence: medium
    note: 建筑物 ↔ 给水管(d>200mm)=3.0m；当前 Solver 切片不编译该方向。

  - rule_id: MU-CLEAR-003
    category: horizontal_clearance
    parameter: clearance_building_to_gas_high_pressure
    value: 1.5
    unit: m
    source_clause: GB 50289-2016 §4.1.9 表 4.1.9
    verified_by: legacy_not_compiled
    confidence: low
    note: 旧条目把燃气压力档压缩成“高压”，与表 4.1.9 的低压/中压 B/A/次高压 B/A 不一致；当前 Solver 切片不编译。

  - rule_id: MU-CLEAR-004
    category: horizontal_clearance
    parameter: clearance_building_to_power_direct_buried
    value: 3.0
    unit: m
    source_clause: GB 50289-2016 §4.1.9 表 4.1.9
    verified_by: legacy_not_compiled
    confidence: low
    note: 旧条目把建筑物与电力管线的多级表头压成单值，当前 Solver 切片不编译。

  - rule_id: MU-CLEAR-005
    category: horizontal_clearance
    parameter: clearance_water_to_sewage_rain
    values:
      d_le_200: 1.0
      d_gt_200: 1.5
    unit: m
    source_clause: GB 50289-2016 §4.1.9 表 4.1.9
    verified_by: original_table_crosscheck
    confidence: high
    verification:
      <<: *gb50289_table419_verification
      evidence_locator: PDF page 13; row 污水、雨水管线; columns 给水管线 d≤200mm / d>200mm
    note: 给水管 ↔ 污水、雨水管线：d≤200mm 为 1.0m，d>200mm 为 1.5m。

  - rule_id: MU-CLEAR-006
    category: horizontal_clearance
    parameter: clearance_sewage_rain_to_gas_by_pressure
    values:
      low: 1.0
      medium_b: 1.2
      medium_a: 1.2
      sub_high_b: 1.5
      sub_high_a: 2.0
    unit: m
    source_clause: GB 50289-2016 §4.1.9 表 4.1.9
    verified_by: original_table_crosscheck
    confidence: high
    verification:
      <<: *gb50289_table419_verification
      evidence_locator: PDF page 13; row 污水、雨水管线; columns 燃气低压 / 中压 B,A / 次高压 B,A
    note: 旧条目“中压 1.5m”错误；原表中压 B/A 合并单元格均为 1.2m，次高压 B/A 分别为 1.5m/2.0m。大于 1.6MPa 不适用本表。

  - rule_id: MU-CLEAR-007
    category: horizontal_clearance
    parameter: clearance_sewage_rain_to_telecom_by_burial
    values:
      direct_buried: 1.0
      duct: 1.0
    unit: m
    source_clause: GB 50289-2016 §4.1.9 表 4.1.9
    verified_by: original_table_crosscheck
    confidence: high
    verification:
      <<: *gb50289_table419_verification
      evidence_locator: PDF page 13; row 污水、雨水管线; columns 通信管线直埋 / 管道、通道
    note: 旧值 0.5m 错误，疑似串入表 4.1.14 垂直净距；表 4.1.9 水平净距两种通信敷设方式均为 1.0m。

  - rule_id: MU-CLEAR-008
    category: horizontal_clearance
    parameter: clearance_sewage_rain_to_power_by_burial
    values:
      direct_buried: 0.5
      protective_conduit: 0.5
    unit: m
    source_clause: GB 50289-2016 §4.1.9 表 4.1.9
    verified_by: original_table_crosscheck
    confidence: high
    verification:
      <<: *gb50289_table419_verification
      evidence_locator: PDF page 13; row 污水、雨水管线; columns 电力管线直埋 / 保护管
    note: 原表该交叉位置为合并单元格 0.5m，不按电压分档；旧编译器强制 voltage_kv 没有规范依据。
