[project]
name = "openbimagent"
version = "0.0.0"
description = "openBIMAgent:Agent + 两个 MCP 的生成式 BIM/场景构建系统(M0 骨架,见 docs/architecture/)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pyyaml",
    "jsonschema",
    "httpx",
    "google-genai",
    "fastmcp",
]

[dependency-groups]
dev = [
    "pytest",
    "python-docx>=1.2.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbimagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]
