[project]
name = "openbimagent"
version = "0.0.0"
description = "openBIMAgent:Agent Core + Blender/Vectorworks MCP 的生成式 BIM/场景构建系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pyyaml",
    "jsonschema",
    "httpx",
    "google-genai",
    "fastmcp",
    "ifcopenshell>=0.8.5",
    "lxml>=4.9",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest",
    "python-docx>=1.2.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbimagent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]
